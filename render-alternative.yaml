services:
  - type: web
    name: trashfun-backend
    env: node
    plan: free
    buildCommand: |
      cd backend
      npm install
      npm run build
    startCommand: |
      cd backend
      npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: https://trashfun-frontend.vercel.app,https://*.vercel.app
    healthCheckPath: /api/health
